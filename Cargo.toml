[package]
name = "rust_api"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.8.0"
sqlx = { version = "0.7.4", features = ["postgres", "runtime-tokio", "chrono", "migrate", "tls-rustls"] }
serde_json = "1.0.120"
serde = { version = "1.0.203", features = ["derive"] }
dotenvy = "0.15.7"
actix-rt = "2.10.0"
cron = "0.12.1"
mockall = "0.12.1"
chrono = {version = "0.4.38", features = ["serde", "alloc", "clock"] }
async-trait = "0.1.80"